<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>라이어스 포커 · 룰렛 레버 안내</title>
  <style>
    :root { color-scheme: dark; --ink:#0d0912; --plum:#281735; --gold:#c9a25b; --cream:#fff5e4; --red:#e0243a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:radial-gradient(circle at 50% 42%, #38214c 0 12%, #160d20 50%, #090611 100%); color:var(--cream); font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    main { width:min(1180px, 100vw); display:grid; grid-template-columns:minmax(0, 1fr) 290px; gap:28px; padding:28px; align-items:center; }
    .stage { position:relative; min-height:680px; overflow:hidden; border:1px solid #805f96; border-radius:30px; background:radial-gradient(circle at 46% 46%, #3a2350 0, #1a1026 54%, #0e0915 100%); box-shadow:0 26px 70px #000a; }
    .eyebrow { position:absolute; z-index:4; top:26px; left:30px; margin:0; color:#dfc58f; letter-spacing:.14em; font-size:12px; font-weight:800; }
    .headline { position:absolute; z-index:4; top:47px; left:30px; margin:0; font-size:30px; letter-spacing:-.04em; }
    .roulette { position:absolute; width:min(68vw, 570px); aspect-ratio:1; left:calc(50% - min(34vw, 285px) - 70px); top:50%; translate:0 -45%; border:23px solid var(--gold); border-radius:50%; background:repeating-conic-gradient(from -11.25deg, #e0243a 0 18deg, #e0243a 18deg 21deg, #24152e 21deg 40deg, #34204a 40deg 45deg); box-shadow:0 0 0 13px #0d0912 inset, 0 20px 55px #0009; transition:filter .3s; }
    .roulette::before { content:""; position:absolute; inset:10%; border:3px solid #ffffff3a; border-radius:50%; }
    .roulette::after { content:""; position:absolute; inset:40%; border:10px solid var(--gold); border-radius:50%; background:#0d0912; box-shadow:0 7px 16px #0009; }
    .pointer { position:absolute; z-index:2; width:0; height:0; border-left:30px solid transparent; border-right:30px solid transparent; border-top:72px solid var(--cream); left:calc(50% - 100px); top:calc(50% - min(34vw, 285px) - 30px); filter:drop-shadow(0 5px 5px #000a); }
    .lever-area { position:absolute; width:240px; height:610px; left:calc(50% + min(34vw, 285px) - 112px); top:calc(50% - 305px); z-index:5; touch-action:none; cursor:ns-resize; }
    .lever-base { position:absolute; left:72px; top:244px; width:88px; height:152px; border-radius:44px; border:4px solid var(--gold); background:#3a2350; }
    .rod { position:absolute; left:111px; top:160px; width:16px; height:260px; border-radius:10px; background:linear-gradient(90deg,#8e7038,#e2c27e,#8e7038); transform-origin:50% 50%; transform:scaleY(calc(.25 + var(--pull))) translateY(calc(100px * var(--pull))); }
    .pivot { position:absolute; left:97px; top:302px; width:44px; height:44px; border:5px solid var(--gold); border-radius:50%; background:var(--ink); z-index:2; }
    .knob { position:absolute; left:76px; top:calc(70px + 400px * var(--pull)); width:104px; height:104px; border-radius:50%; background:radial-gradient(circle at 32% 25%, #ff94a1, #e0243a 54%, #821327); box-shadow:0 13px 24px #0009; transition:top .08s linear; }
    .hint { position:absolute; inset:0; opacity:1; transition:opacity .16s ease; pointer-events:none; }
    .is-pulling .hint,.is-spun .hint { opacity:0; }
    .ring { position:absolute; left:66px; top:60px; width:124px; height:124px; border:3px solid #ffe0a3; border-radius:50%; box-shadow:0 0 22px #e8b95a; }
    .pulse { position:absolute; left:62px; top:56px; width:132px; height:132px; border:7px solid #ffdea0; border-radius:50%; opacity:.8; animation:pulse 1.25s infinite ease-out; }
    .down { position:absolute; left:88px; top:190px; width:104px; display:grid; justify-items:center; gap:2px; color:#ffe0a3; text-shadow:0 4px 9px #000; animation:bob 1.25s infinite ease-in-out; }
    .arrow { font-size:62px; line-height:.8; }
    .hand { font-size:66px; line-height:.9; filter:drop-shadow(0 5px 8px #000a); }
    .hint-copy { position:absolute; top:340px; left:-20px; width:280px; padding:13px 17px; text-align:center; white-space:nowrap; font-weight:800; font-size:18px; border:2px solid #ffdea0; border-radius:28px; background:#160f20ee; box-shadow:0 10px 18px #0008; }
    .spin { animation:spin 1.8s cubic-bezier(.2,.7,.1,1) forwards; }
    .result { position:absolute; inset:0; display:grid; place-items:center; z-index:4; opacity:0; pointer-events:none; transition:opacity .25s; font-size:30px; font-weight:900; text-shadow:0 3px 18px #000; }
    .is-spun .result { opacity:1; }
    aside { padding:6px 2px; }
    aside h2 { margin:0 0 15px; font-size:21px; letter-spacing:-.04em; }
    aside p { margin:0 0 20px; color:#d6c9dc; line-height:1.65; font-size:14px; }
    ol { margin:0; padding:0; list-style:none; display:grid; gap:12px; }
    li { display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:start; color:#dfd4e4; font-size:14px; line-height:1.45; }
    li b { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:#5b3b70; color:#ffe0a3; font-size:12px; }
    button { margin-top:24px; width:100%; border:0; border-radius:14px; padding:14px; background:var(--gold); color:#160f20; font:inherit; font-weight:900; cursor:pointer; }
    .note { margin-top:12px; font-size:12px; color:#ad9bb8; }
    @keyframes pulse { from { transform:scale(.86); opacity:.9; } to { transform:scale(1.52); opacity:0; } }
    @keyframes bob { 0%,100% { translate:0 -6px; } 50% { translate:0 10px; } }
    @keyframes spin { to { rotate:1440deg; } }
    @media (max-width:820px) { body { overflow:auto; } main { grid-template-columns:1fr; padding:14px; } .stage { min-height:min(690px, 86vh); } aside { padding:8px 10px 30px; } .roulette { width:min(72vw, 480px); left:calc(50% - min(36vw, 240px) - 42px); } .pointer { left:calc(50% - 72px); } .lever-area { scale:.84; transform-origin:left center; left:calc(50% + min(36vw, 240px) - 92px); } }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="룰렛 레버 안내 연출 데모">
      <p class="eyebrow">LIAR'S POKER · PENALTY ROULETTE</p>
      <h1 class="headline">레버 안내 효과</h1>
      <div class="pointer" aria-hidden="true"></div>
      <div class="roulette" id="wheel" aria-hidden="true"></div>
      <div class="result">룰렛 회전 시작!</div>
      <div class="lever-area" id="lever" role="slider" aria-label="룰렛 레버를 아래로 당기기" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="--pull:0">
        <div class="lever-base"></div><div class="rod"></div><div class="pivot"></div><div class="knob"></div>
        <div class="hint"><div class="pulse"></div><div class="ring"></div><div class="down"><span class="arrow">↓</span><span class="hand">☝</span></div><div class="hint-copy">레버를 아래로 당기세요</div></div>
      </div>
    </section>
    <aside>
      <h2>앱 구현 방식</h2>
      <p>카드 덱의 탭 안내처럼, 레버가 처음 보일 때만 조작 위치와 방향을 알려줍니다.</p>
      <ol>
        <li><b>1</b><span>손잡이 둘레의 금색 펄스 링을 반복합니다.</span></li>
        <li><b>2</b><span>손가락과 아래 화살표가 당기는 방향을 보여 줍니다.</span></li>
        <li><b>3</b><span>드래그 시작 즉시 안내를 숨기고, 레버 동작만 남깁니다.</span></li>
        <li><b>4</b><span>레버를 끝까지 내리면 서버 결과를 기다리며 룰렛을 돌립니다.</span></li>
      </ol>
      <button type="button" id="reset">다시 보기</button>
      <div class="note">빨간 손잡이를 아래로 드래그해 보세요.</div>
    </aside>
  </main>
  <script>
    const lever=document.querySelector('#lever'), wheel=document.querySelector('#wheel'), stage=document.querySelector('.stage'), reset=document.querySelector('#reset');
    let startY=null, pulling=false;
    const setPull=value=>{ const pull=Math.max(0,Math.min(1,value)); lever.style.setProperty('--pull',pull); lever.setAttribute('aria-valuenow',String(Math.round(pull*100))); return pull; };
    const begin=event=>{ if(stage.classList.contains('is-spun')) return; pulling=true; startY=event.clientY; stage.classList.add('is-pulling'); lever.setPointerCapture?.(event.pointerId); };
    const move=event=>{ if(!pulling) return; setPull((event.clientY-startY)/260); };
    const end=()=>{ if(!pulling) return; pulling=false; const pull=Number.parseFloat(getComputedStyle(lever).getPropertyValue('--pull'))||0; if(pull>.72){ setPull(1); stage.classList.remove('is-pulling'); stage.classList.add('is-spun'); wheel.classList.add('spin'); } else { stage.classList.remove('is-pulling'); setPull(0); } };
    lever.addEventListener('pointerdown',begin); lever.addEventListener('pointermove',move); lever.addEventListener('pointerup',end); lever.addEventListener('pointercancel',end);
    reset.addEventListener('click',()=>{ stage.classList.remove('is-pulling','is-spun'); wheel.classList.remove('spin'); setPull(0); });
  </script>
</body>
</html>
