/* ═══════════════════════════════════════════════════════════
   모시겜 룰 상영관 — 헤더·버튼 없이 자동으로 재생되는 설명 화면
   라이어스 포커와 파이널콜이 번갈아 나오며, 매 장면마다
   "무엇을 누르는지"와 "어떻게 이기는지"를 화면 위에 표시합니다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --u:min(1.04vw,1.84vh);
  --ease:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  background:#06040A;color:#fff;
  font-family:Plex,-apple-system,"Apple SD Gothic Neo",sans-serif;
  cursor:none;
}

/* ── 필름 ─────────────────────────────────────────────── */
.film{
  position:fixed;inset:0;opacity:0;visibility:hidden;
  transition:opacity .7s var(--ease),visibility .7s;
  display:grid;grid-template-rows:1fr auto;
}
.film[data-on="true"]{opacity:1;visibility:visible}

#film-lp{
  --abyss:#0D0912; --night:#160C1F; --felt:#3F1A5C;
  --panel:#22122F; --panel-up:#2B1640; --edge:#3A2350;
  --gold:#C9A25B; --gold-lt:#E2C27E; --gold-sh:#5A3F14;
  --ivory:#F3EEE6; --ivory-edge:#C8C0B4; --ink:#1B1022;
  --muted:#A898BC; --muted-lt:#D8C9EA; --dim:#5A4170;
  --red:#E0243A; --red-deep:#9A1426; --red-sh:#5A0A14;
  --accent:var(--gold-lt);
  background:
    radial-gradient(100% 75% at 50% 42%, #2A1638 0%, #140B1D 55%, #07050B 100%);
}
#film-fc{
  --night:#2B1E6B; --night-deep:#1E1550; --ink:#1B1530;
  --violet:#6C4CF0; --violet-deep:#4A3AA8; --lilac:#F4EFFF;
  --muted:#6B6390; --yellow:#FFC93C;
  --red:#FF5A5F; --blue:#3D7BFF; --green:#1FB57A;
  --accent:var(--yellow);
  background:
    radial-gradient(100% 75% at 50% 42%, #3B2A92 0%, #231870 55%, #120C32 100%);
}

/* 가장자리를 눌러 화면 가운데로 시선을 모읍니다. */
.vignette{
  position:fixed;inset:0;pointer-events:none;z-index:40;
  background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);
}

/* ── 두 기기 화면 ─────────────────────────────────────── */
.screens{
  display:flex;align-items:center;justify-content:center;
  gap:calc(var(--u)*4);padding:calc(var(--u)*4) calc(var(--u)*5) calc(var(--u)*2);
  min-height:0;
}
.device{
  position:relative;display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--u)*1.1);
  transition:transform .7s var(--ease),opacity .7s var(--ease),filter .7s var(--ease);
}
/* 지금 봐야 할 기기만 또렷하게 남기고 나머지는 뒤로 물립니다. */
.screens[data-focus="tablet"] .d-phone,
.screens[data-focus="phone"] .d-tablet{
  opacity:.34;filter:saturate(.5) blur(1.5px);transform:scale(.93);
}
.screens[data-focus="tablet"] .d-tablet,
.screens[data-focus="phone"] .d-phone{transform:scale(1.03)}
.d-tablet{flex:0 1 auto;height:100%;min-height:0}
.d-phone{flex:0 0 auto;height:100%;min-height:0}

/* ── 자막 ─────────────────────────────────────────────── */
.screens,.lesson{grid-row:1}
.sub{grid-row:2}

/* 기기 화면 대신 카드 구성·조합을 보여 주는 설명 장면입니다. */
.lesson{display:none;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;padding:calc(var(--u)*3) calc(var(--u)*5) calc(var(--u)*1)}
.film[data-mode="lesson"] .screens{display:none}
.film[data-mode="lesson"] .lesson{display:flex}
.lesson > *{animation:cardin .6s var(--ease) both}
#film-lp .kinds .c,#film-lp .jokeruse > .c{--cw:calc(var(--u)*8)}
#film-lp .jokeruse .trio .c{--cw:calc(var(--u)*6)}
#film-fc .fcdeck .pc{--cw:calc(var(--u)*2.9)}
#film-fc .combo .hand .pc{--cw:calc(var(--u)*3.6)}
.lesson-note{
  margin-top:calc(var(--u)*2.6);font-size:calc(var(--u)*1.8);font-weight:600;
  color:#fff;opacity:.92;word-break:keep-all;
}
.lesson-note b{color:var(--accent)}

/* 카드 종류와 장수 */
.kinds{display:flex;gap:calc(var(--u)*3.4);justify-content:center;align-items:flex-end}
.kinds figure{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2)}
.kinds figcaption{font-size:calc(var(--u)*2.2);font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums}

/* 조커가 세 기준 카드로 통하는 그림 */
.jokeruse{display:flex;align-items:center;gap:calc(var(--u)*3.2);justify-content:center}
.jokeruse .arrow{font-size:calc(var(--u)*3);color:var(--accent)}
.jokeruse .trio{display:flex;gap:calc(var(--u)*1.2)}

/* 파이널콜 40장 */
.fcdeck{display:flex;flex-direction:column;gap:calc(var(--u)*.7)}
.fcdeck .row{display:flex;gap:calc(var(--u)*.6);justify-content:center}

/* 조합 예시 줄 */
.combos{display:flex;flex-direction:column;gap:calc(var(--u)*1.1);width:min(calc(var(--u)*82),100%)}
.combo{
  display:flex;align-items:center;gap:calc(var(--u)*2.2);justify-content:center;
  padding:calc(var(--u)*1) calc(var(--u)*1.8);border-radius:calc(var(--u)*1.2);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
}
.combo.best{background:rgba(255,201,60,.16);border-color:rgba(255,201,60,.5)}
/* 지금 설명하는 한 줄만 밝히고 나머지는 뒤로 물립니다. */
.combo{transition:opacity .45s var(--ease),filter .45s var(--ease),transform .45s var(--ease)}
.combo.off{opacity:.22;filter:grayscale(.75)}
.combo.on{transform:scale(1.035)}
.combo.on .pt{animation:ptpop .5s var(--ease) .35s both}
.combo.on .calc span.win{animation:winglow 1.8s ease-in-out .4s infinite}
@keyframes ptpop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
@keyframes winglow{
  0%,100%{text-shadow:none;transform:scale(1)}
  50%{text-shadow:0 0 calc(var(--u)*1.4) var(--accent);transform:scale(1.07)}
}
.combo .calc span{display:inline-block;transition:opacity .4s}
.combo .hand{display:flex;gap:calc(var(--u)*.5)}
.combo .calc{display:flex;gap:calc(var(--u)*1);font-size:calc(var(--u)*1.5);font-weight:600}
.combo .calc span{opacity:.5}
.combo .calc span.win{opacity:1;color:var(--accent)}
.combo .pt{margin-left:auto;font-size:calc(var(--u)*2.4);font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.combo.best .pt{color:var(--accent)}

.sub{
  position:relative;z-index:30;text-align:center;
  padding:calc(var(--u)*1.6) calc(var(--u)*6) calc(var(--u)*3.4);
  background:linear-gradient(0deg,rgba(4,2,8,.92) 20%,rgba(4,2,8,.6) 70%,transparent);
}
.sub p{
  font-size:calc(var(--u)*2.15);font-weight:600;line-height:1.5;
  text-wrap:balance;word-break:keep-all;max-width:54ch;margin:0 auto;
  text-shadow:0 2px 12px rgba(0,0,0,.6);
}
.sub p b{color:var(--accent);font-weight:700}
.subfade{animation:subin .55s var(--ease) both}
@keyframes subin{from{opacity:0;transform:translateY(calc(var(--u)*.9))}to{opacity:1;transform:none}}

/* ── 누를 곳 표시 ─────────────────────────────────────── */
.tap{
  position:absolute;left:50%;top:50%;z-index:20;pointer-events:none;
  width:calc(var(--u)*5.6);height:calc(var(--u)*5.6);
  transform:translate(-50%,-50%);opacity:0;transition:opacity .35s;
}
.tap[data-on="true"]{opacity:1}
.tap i{
  position:absolute;inset:0;border-radius:50%;
  border:calc(var(--u)*.3) solid #fff;opacity:0;
  animation:ripple 1.8s var(--ease) infinite;
}
.tap i:nth-child(2){animation-delay:.6s}
@keyframes ripple{
  0%{transform:scale(.45);opacity:0}
  25%{opacity:.95}
  100%{transform:scale(1.9);opacity:0}
}
.tap u{
  position:absolute;left:66%;top:66%;width:26%;height:26%;border-radius:50%;
  transform:translate(-50%,-50%);background:rgba(255,255,255,.92);text-decoration:none;
  box-shadow:0 0 calc(var(--u)*1.2) rgba(255,255,255,.8),0 0 0 calc(var(--u)*.16) rgba(0,0,0,.25);
  animation:press 1.8s var(--ease) infinite;
}
@keyframes press{0%,60%,100%{transform:translate(-50%,-50%) scale(1)}70%{transform:translate(-50%,-50%) scale(.68)}}
.tap em{
  position:absolute;left:50%;top:calc(100% + var(--u)*.8);transform:translateX(-50%);
  white-space:nowrap;font-style:normal;font-size:calc(var(--u)*1.25);font-weight:700;
  background:#fff;color:#14101F;border-radius:999px;
  padding:calc(var(--u)*.45) calc(var(--u)*1.3);
  box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.4) rgba(0,0,0,.5);
}
.tap em::before{
  content:"";position:absolute;left:50%;top:calc(var(--u)*-.55);transform:translateX(-50%);
  border:calc(var(--u)*.45) solid transparent;border-bottom-color:#fff;
}
.tap.up em{top:auto;bottom:calc(100% + var(--u)*.8)}
.tap.up em::before{top:auto;bottom:calc(var(--u)*-.55);border-bottom-color:transparent;border-top-color:#fff}
.tap.side em{left:auto;right:calc(100% + var(--u)*1.1);top:50%;bottom:auto;
  transform:translateY(-50%)}
.tap.side em::before{left:auto;right:calc(var(--u)*-.85);top:50%;bottom:auto;
  transform:translateY(-50%);border-bottom-color:transparent;border-left-color:#fff}

/* ── 장(章) 카드 · 승리 카드 ──────────────────────────── */
.card{
  position:fixed;inset:0;z-index:35;display:grid;place-items:center;
  opacity:0;visibility:hidden;transition:opacity .6s var(--ease),visibility .6s;
  background:rgba(4,2,8,.72);backdrop-filter:blur(calc(var(--u)*.6));
}

  border:calc(var(--u)*.3) solid var(--ink);border-radius:calc(var(--u)*.9);

}

<body>
<!-- ═══════════ 라이어스 포커 ═══════════ -->
<section class="film" id="film-lp">
  <div class="screens" data-focus="tablet" data-step="deal">
    <div class="device d-tablet">
      <div class="tablet">
        <div class="table">
          <div class="felt">
            <div class="center">
              <div class="rank">
                <div class="c"><i>A</i><b>A</b><i>A</i></div>
              </div>
              <div class="pile">
                <div class="c back"><i>A</i><b>A</b><i>A</i></div>
                <div class="c back"><i>K</i><b>K</b><i>K</i></div>
              </div>
            </div>
            <div class="shout">LIAR!</div>
            <div class="verdict">거짓이 밝혀졌습니다</div>
            <div class="roul">
              <div class="wheelbox">
                <div class="rim"><div class="inner2"><div class="wheel" id="wheel"></div></div></div>
                <div class="hub"></div><div class="ptr"></div>
              </div>
              <div class="odds">민준의 첫 번째 룰렛 · 탈락 칸 <b>4/16</b><br><span id="roulres">레버를 내립니다…</span></div>
            </div>
          </div>
          <div class="fly">
            <div class="c back" style="--dx:0;--dy:calc(var(--u)*-13);--dr:4deg"></div>
            <div class="c back" style="--dx:calc(var(--u)*13);--dy:0;--dr:-6deg"></div>
            <div class="c back" style="--dx:0;--dy:calc(var(--u)*13);--dr:3deg"></div>
            <div class="c back" style="--dx:calc(var(--u)*-13);--dy:0;--dr:-4deg"></div>
          </div>
          <div class="seat s0" style="--ac:#F2B8C6"><span class="ava"></span><span class="nm">하린</span><span class="ct">5장</span></div>
          <div class="seat s1" style="--ac:#A8D5BA"><span class="ava"></span><span class="nm">도윤</span><span class="ct">5장</span></div>
          <div class="seat s2" style="--ac:#F6D78A"><span class="ava"></span><span class="nm">사라</span><span class="ct">5장</span></div>
          <div class="seat s3 turn" style="--ac:#A9C4F5"><span class="ava"></span><span class="nm">민준</span><span class="ct" id="lp-count">5장</span></div>
        </div>
      </div>
    </div>

    <div class="device d-phone">
      <div class="phone">
        <div class="pbar">
          <span class="rankbadge">A</span>
          <span class="who" id="lp-who">민준</span>
          <span class="ico">?</span><span class="ico">⏻</span>
        </div>
        <div class="ptimer" id="lp-timer">0:24</div>
        <div class="pmsg" id="lp-msg">태블릿에서 카드를 배분하는 중입니다</div>
        <div class="phand">
          <div class="c back pick"><i>A</i><b>A</b><i>A</i>
            <span class="tap side" id="tap-hand"><i></i><i></i><u></u><em>카드를 눌러 고르기</em></span>
          </div>
          <div class="c back pick"><i>K</i><b>K</b><i>K</i></div>
          <div class="c back"><i>Q</i><b>Q</b><i>Q</i></div>
          <div class="c back joker"><i>J</i><b>JOKER</b><i>J</i></div>
          <div class="c back"><i>K</i><b>K</b><i>K</i></div>
        </div>
        <div class="pact">
          <div class="submit">제출
            <span class="tap side" id="tap-submit"><i></i><i></i><u></u><em>제출 누르기</em></span>
          </div>
          <div class="puck">Liar
            <span class="tap side" id="tap-liar"><i></i><i></i><u></u><em>꾹 눌러 LIAR</em></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="lesson" id="lp-lesson"></div>
  <div class="sub"><p id="lp-sub"></p></div>
</section>

<!-- ═══════════ 파이널콜 ═══════════ -->
<section class="film" id="film-fc">
  <div class="screens" data-focus="tablet" data-step="seat">
    <div class="device d-tablet">
      <div class="tablet dotted">
        <div class="felt">
          <div class="mat"></div>
          <div class="mid">
            <div class="turnpill"><span id="fc-turn">민준 차례예요</span><span class="t" id="fc-time">0:18</span></div>
            <div class="midcards">
              <div class="pc back"><span class="q">?</span></div>
              <div class="pc green">7</div>
            </div>
          </div>
          <div class="callstamp">CALL!</div>
          <div class="plate p0" data-team="blue" style="--ac:#A9C4F5"><span class="ava"></span>
            <span class="nm" style="--tc:var(--blue)">민준</span>
            <span class="hearts" data-p="0"><i>♥</i><i>♥</i><i>♥</i></span></div>
          <div class="plate p1" data-team="red" style="--ac:#F6D78A"><span class="ava"></span>
            <span class="nm" style="--tc:var(--red)">사라</span>
            <span class="hearts" data-p="1"><i>♥</i><i>♥</i><i>♥</i></span></div>
          <div class="plate p2" data-team="blue" style="--ac:#A8D5BA"><span class="ava"></span>
            <span class="nm" style="--tc:var(--blue)">도윤</span>
            <span class="hearts" data-p="2"><i>♥</i><i>♥</i><i>♥</i></span></div>
          <div class="plate p3" data-team="red" style="--ac:#F2B8C6"><span class="ava"></span>
            <span class="nm" style="--tc:var(--red)">하린</span>
            <span class="hearts" data-p="3"><i>♥</i><i>♥</i><i>♥</i></span></div>
        </div>
      </div>
    </div>

    <div class="device d-phone">
      <div class="phone dotted">
        <div class="pbar">
          <span class="me"><span class="ava"></span><span class="nm">사라</span>
            <span class="hearts"><i>♥</i><i>♥</i><i>♥</i></span></span>
          <span class="ico">?</span>
        </div>
        <div class="pstatus" id="fc-status"><span id="fc-statustext">내 차례!</span><span class="t" id="fc-timer">0:24</span></div>
        <div class="phand" id="fc-hand"></div>
        <div class="bracket"><span id="fc-combo">7 + 7 = 14점</span></div>
        <div class="ppanel" id="fc-panel"></div>
      </div>
    </div>
  </div>
  <div class="lesson" id="fc-lesson"></div>
  <div class="sub"><p id="fc-sub"></p></div>
</section>

<div class="card" id="card"><div class="inner" id="card-inner"></div></div>
<div class="vignette"></div>

<script>

var FILM = [
{game:'lp', kind:'intro', ms:6000, book:'lp',
 define:'카드를 뒷면으로 내고 <b>거짓말로 속이는</b> 게임'},

{game:'lp', kind:'lesson', ms:7000,

 html:'<div class="kinds"><figure><div class="c"><i>A</i><b>A</b><i>A</i></div><figcaption>×6</figcaption></figure><figure><div class="c"><i>K</i><b>K</b><i>K</i></div><figcaption>×6</figcaption></figure><figure><div class="c"><i>Q</i><b>Q</b><i>Q</i></div><figcaption>×6</figcaption></figure><figure><div class="c joker"><i>J</i><b>JOKER</b><i>J</i></div><figcaption>×2</figcaption></figure></div><p class="lesson-note">4명이 하면 모두 <b>20장</b> · 한 사람이 <b>5장</b>씩 받습니다</p>'},

{game:'lp', kind:'scene', step:'rank', focus:'tablet', ms:5400,

{game:'lp', kind:'lesson', ms:7000,

{game:'lp', kind:'card', ms:7000, card:

  for(i=0;i<total;i++){
    parts.push((bad.indexOf(i)>=0?'var(--red)':'var(--panel-up)')+' '+(i*seg)+'deg '+((i+1)*seg)+'deg');
  }
  var el=document.getElementById('wheel');
  el.style.background='repeating-conic-gradient(rgba(243,238,230,.45) 0 .45deg,transparent .45deg '+seg+'deg),'
    +'conic-gradient('+parts.join(',')+')';
})();

var lp=document.querySelector('#film-lp .screens');
var fc=document.querySelector('#film-fc .screens');
var card=document.getElementById('card'), cardInner=document.getElementById('card-inner');
var idx=0, playing=true, timer=null;

function setSub(el,html){
  el.innerHTML=html;
  el.classList.remove('subfade'); void el.offsetWidth; el.classList.add('subfade');
}

function apply(){
  var s=FILM[idx];
  document.getElementById('film-lp').dataset.on = (s.game==='lp');
  document.getElementById('film-fc').dataset.on = (s.game==='fc');
  var taps=document.querySelectorAll('.tap'), i;
  for(i=0;i<taps.length;i++) taps[i].dataset.on='false';

  var film=document.getElementById('film-'+s.game);
  film.dataset.mode = (s.kind==='lesson') ? 'lesson' : 'play';
  if(s.kind==='lesson'){
    card.dataset.on='false';
    document.getElementById(s.game+'-lesson').innerHTML=s.html;
    setSub(document.getElementById(s.game+'-sub'), s.sub);
  }else if(s.kind==='card'||s.kind==='intro'){
    cardInner.innerHTML = s.kind==='intro'
      ? '<div class="intro"><div class="book">'+BOOKS[s.book]+'</div>'+
        '<p class="define">'+s.define+'</p></div>'
      : s.card;
    card.dataset.game=s.game;
    card.dataset.on='true';
  }else{
    card.dataset.on='false';
    if(s.game==='lp') applyLP(s); else applyFC(s);
    if(s.tap){
      var el=document.getElementById('tap-'+s.tap)||document.querySelector('[data-tap="'+s.tap+'"]');
      if(el) setTimeout(function(){ if(FILM[idx]===s) el.dataset.on='true'; },700);
    }
  }
  schedule(s.ms);
}

function applyLP(s){
  lp.dataset.step=s.step;
  lp.dataset.focus=s.focus;
  document.getElementById('lp-who').textContent=s.phone.who;
  document.getElementById('lp-msg').innerHTML=s.phone.msg;
  var t=document.getElementById('lp-timer');
  t.textContent=s.phone.timer; t.style.visibility=s.phone.timer?'visible':'hidden';
  var hand=lp.querySelectorAll('.phand .c'), i;
  for(i=0;i<hand.length;i++) hand[i].classList.toggle('back',!s.phone.face);
  var pile=lp.querySelectorAll('.pile .c'), open=(s.step==='reveal'||s.step==='roulette');
  for(i=0;i<pile.length;i++) pile[i].classList.toggle('back',!open);
  var seats=lp.querySelectorAll('.seat');
  for(i=0;i<seats.length;i++) seats[i].classList.remove('turn');
  var cur=(s.step==='played'||s.step==='liar'||s.step==='reveal')?'s0':'s3';
  if(s.step!=='deal'&&s.step!=='roulette') lp.querySelector('.seat.'+cur).classList.add('turn');
  var spent=(s.step==='played'||s.step==='liar'||s.step==='reveal'||s.step==='roulette');
  document.getElementById('lp-count').textContent = spent?'3장':'5장';
  setSub(document.getElementById('lp-sub'), s.sub);
  if(s.step==='roulette') spin();
}

function spin(){
  var w=document.getElementById('wheel'), res=document.getElementById('roulres');
  var land = 360*4 + 360 - (22.5*2 + 11);
  w.style.transition='none'; w.style.transform='rotate(0deg)';
  res.textContent='레버를 내립니다…';
  requestAnimationFrame(function(){
    w.style.transition='transform 2.6s cubic-bezier(.15,.85,.25,1)';
    requestAnimationFrame(function(){ w.style.transform='rotate('+land+'deg)'; });
  });
  setTimeout(function(){
    if(FILM[idx].step==='roulette') res.innerHTML='살아남았습니다 — 다음 룰렛은 <b>5/15</b>';
  },2800);
}

function applyFC(s){
  fc.dataset.step=s.step;
  fc.dataset.focus=s.focus;
  document.getElementById('fc-turn').textContent=s.turn;
  var tt=document.getElementById('fc-time');
  tt.textContent=s.time; tt.style.display=s.time?'':'none';
  var st=document.getElementById('fc-status');
  st.classList.toggle('hot',!!s.hot);
  document.getElementById('fc-statustext').textContent=s.status;
  var pt=document.getElementById('fc-timer');
  pt.textContent=s.timer; pt.style.display=s.timer?'':'none';
  document.getElementById('fc-hand').innerHTML=FC_HAND[s.hand];
  document.getElementById('fc-combo').textContent=s.combo;
  document.getElementById('fc-panel').innerHTML=s.panel;
  var plates=fc.querySelectorAll('.plate'), i;
  for(i=0;i<plates.length;i++) plates[i].classList.remove('turn','out');
  if(s.step==='hearts'||s.step==='score') fc.querySelector('.plate.p0').classList.add('turn');
  if(s.step==='draw'||s.step==='swap'||s.step==='call'||s.step==='four') fc.querySelector('.plate.p1').classList.add('turn');
  var m=fc.querySelector('.hearts[data-p="0"]');
  m.innerHTML = (s.step==='reveal') ? '<i>♥</i><i>♥</i><i class="lost">♥</i>' : '<i>♥</i><i>♥</i><i>♥</i>';
  setSub(document.getElementById('fc-sub'), s.sub);
}

function schedule(ms){ clearTimeout(timer); if(playing) timer=setTimeout(function(){ go(idx+1); }, ms); }
function go(i){ idx=(i+FILM.length)%FILM.length; apply(); }

/* 화면에는 조작 요소를 두지 않고 키보드로만 다룹니다. */
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){ go(idx+1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ go(idx-1); e.preventDefault(); }
  else if(e.key===' '){ playing=!playing; if(playing){apply();}else{clearTimeout(timer);} e.preventDefault(); }
  else if(e.key.toLowerCase()==='r'){ go(0); }
});

var q=new URLSearchParams(location.search);
if(q.has('s')) idx=Math.max(0,Math.min(FILM.length-1,(parseInt(q.get('s'),10)||1)-1));
apply();
if(q.has('pause')){ playing=false; clearTimeout(timer); }
</script>
</body>
